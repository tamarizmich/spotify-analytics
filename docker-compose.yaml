services:

  backend:
    build:
      context: ./backend
    container_name: kpop-music-intelligence-backend
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: kpop-music-intelligence-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend